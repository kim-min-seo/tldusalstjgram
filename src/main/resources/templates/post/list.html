<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<section layout:fragment="contents" class="post-list">
    <div th:each="post : ${posts}" class="post-item">
        <div class="post-header d-flex align-items-center mb-2">
            <i class="bi bi-person-circle" style="font-size: 20px;"></i>
            <strong th:text="${post.nickname}" class="user-nickname ms-2"></strong>
            
            <div class="dropdown ms-auto">
			  <button class="btn btn-light border-0 dropdown-toggle" type="button" data-bs-toggle="dropdown">
			    <i class="bi bi-three-dots-vertical"></i>
			  </button>
			  <ul class="dropdown-menu">
			    <li><a class="dropdown-item edit-post" th:data-post-id="${post.id}">수정</a></li>
			    <li><a class="dropdown-item delete-post" th:data-post-id="${post.id}">삭제</a></li>
			  </ul>
			</div>
            
        </div>

        <img th:src="@{${post.imagePath}}" alt="Post Image" class="post-image mb-2"/>

        <div class="post-actions d-flex justify-content-between align-items-center gap-3 mb-2">
            <div class="left-actions d-flex align-items-center gap-3">
                <button class="btn btn-light border-0 p-0 d-flex align-items-center">
                   
                    <i th:class="${post.isLike} ? 'bi bi-heart-fill me-1 heart-icon text-danger' : 'bi bi-heart me-1 heart-icon text-secondary'" 
  					   th:data-post-id="${post.id}"></i>
                    
                    <span>좋아요 <span th:id="'likeCount' + ${post.id}" th:text="${post.likeCount}">0</span>개</span>
                    
                </button>
                <button class="btn btn-light border-0 p-0 d-flex align-items-center ">
                    <i class="bi bi-chat-dots me-1"></i> 
                </button>
                <button class="btn btn-light border-0 p-0 d-flex align-items-center">
                    <i class="bi bi-share me-1"></i> 
                </button>
            </div>
            <button class="btn btn-light border-0 p-0">
                <i class="bi bi-bookmark"></i>
            </button>
        </div>

        <div class="post-caption">
            <strong th:text="${post.nickname}" class="post-caption-username me-1"></strong>
            <span th:text="${post.caption}" class="post-caption-text"></span>
        </div>

       <!-- 댓글 목록 -->
		<div class="comment-container" th:id="'comment-container-' + ${post.id}">
		    <div th:each="comment : ${post.comments}">
		        <p>
		            <strong th:text="${comment.user.nickname}">작성자</strong>: 
		            <span th:text="${comment.comments}">댓글 내용</span>
		            <button type="button" class="btn btn-danger btn-sm ms-2 delete-comment" 
		                    th:data-comment-id="${comment.id}" th:data-post-id="${post.id}">
		                삭제
		            </button>
		        </p>
		    </div>
		</div>
		       

        <!-- 댓글 입력 폼 -->
		<div class="comment-input-area d-flex mt-2">
		    <form class="comment-form d-flex" th:action="@{/post/list/comments}" method="post">
		        
		        <input type="hidden" th:name="postId" th:value="${post.id}" />
		        
		        <!-- 댓글 텍스트 입력 필드 -->
		        <input type="text" class="form-control comment-input w-200" th:id="|commentInput${post.id}|" name="comments" placeholder="댓글을 입력하세요" />
		        
		        <!-- 버튼을 옆에 배치 -->
		        <button type="submit" class="btn btn-dark ms-2 btn-circle" th:data-post-id="${post.id}">
		            <i class="bi bi-arrow-up"></i>
		        </button>
		    </form>
		</div>
        
        
    </div>

    <div class="d-flex justify-content-center mt-4">
        <a href="/post/create" class="btn btn-dark w-50">게시물 작성</a>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script layout:fragment= "script">
	$(".edit-post").click(function () {
		  const postId = $(this).data("post-id");
		  window.location.href = `/post/update?postId=${postId}`;
		});

	
	$(".heart-icon").on("click", function(){
		let postId = $(this).data("post-id");
		let heartIcon = $(this);
		let likeCountSpan = $("#likeCount" + postId);
		
		$.ajax({
			type:"POST"
			, url : "/post/like"
			, data : {"postId" : postId}
			, success:function(response){
				if(response.result === "success"){
					if (response.isLike) {
				        heartIcon.removeClass("bi-heart text-secondary")
				                 .addClass("bi-heart-fill text-danger");
				    } else {
				        heartIcon.removeClass("bi-heart-fill text-danger")
				                 .addClass("bi-heart text-secondary");
				    }
				    likeCountSpan.text(response.likeCount);
				} else {
					alert("좋아요 실패: " + (response.reason || ""));
				}
			},
			error: function(){
				alert("좋아요 에러!");
			}
		});
	});


    $(document).ready(function() {
        // 댓글 폼 제출 시 AJAX 요청 보내기
        $(".comment-form").on('submit', function(e) {

                    }
                },
                error: function() {
                    alert('댓글 작성 에러');
                }
            });
        });
        
        
        $(".delete-comment").click(function() {
            var commentId = $(this).data("comment-id"); 
            var postId = $(this).data("post-id");

           
            $.ajax({
                type: "DELETE",
                url: "/comments/remove", 
                data: {
                    commentId: commentId
                },
                success: function(response) {

        $(".delete-post").click(function () {
        	  const postId = $(this).data("post-id");
        	  if (confirm("정말 삭제하시겠습니까?")) {
        	    $.ajax({
        	      url: "/post/delete",
        	      type: "DELETE",
        	      data: { postId: postId },
        	      success: function (response) {
        	        if (response.result === "success") {
        	          alert("삭제 완료");
        	          location.reload();

        	          alert("삭제 실패");
        	        }
        	      },
        	      error: function () {
        	        alert("삭제 중 오류 발생");

        	});

</script>

</html>
