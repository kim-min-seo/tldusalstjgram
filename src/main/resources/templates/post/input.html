<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

    <section layout:fragment="contents" class="bg-light py-5">
        <div class="container d-flex justify-content-center">
            <div class="card shadow-sm" style="width: 500px; min-height: 700px;">
                <div class="card-body p-4">
                    <form th:action="@{/post/create-post}" method="post" enctype="multipart/form-data">
                        <div class="mb-3 d-flex align-items-center">
                            <i class="bi bi-pencil fs-3 me-3"></i>
                            <label for="caption" class="form-label flex-grow-1">캡션 추가</label>
                            <input type="text" class="form-control" id="caption" name="caption" required>
                        </div>

                        <div class="mb-3 d-flex align-items-center">
                            <i class="bi bi-music-note fs-3 me-3"></i>
                            <label for="music" class="form-label flex-grow-1">음악</label>
                            <input type="text" class="form-control" id="music" name="music">
                        </div>

                        <div class="mb-3 d-flex align-items-center">
                            <i class="bi bi-person-plus fs-3 me-3"></i>
                            <label for="tagPeople" class="form-label flex-grow-1">사람 태그</label>
                            <input type="text" class="form-control" id="tagPeople" name="tagPeople">
                        </div>

                        <div class="mb-3 d-flex align-items-center">
                            <i class="bi bi-geo-alt fs-3 me-3"></i>
                            <label for="location" class="form-label flex-grow-1">위치</label>
                            <input type="text" class="form-control" id="location" name="location">
                        </div>

                        <div class="mb-3 d-flex align-items-center">
                            <i class="bi bi-eye fs-3 me-3"></i>
                            <label for="audience" class="form-label flex-grow-1">공개 대상</label>
                            <input type="text" class="form-control" id="audience" name="audience">
                        </div>

                        <div class="mb-3">
                            <label for="imageFile" class="form-label">이미지 업로드</label>
                            <input type="file" class="form-control" id="imageFile" name="imageFile">
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-dark w-50">게시물 공유하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

</html>
